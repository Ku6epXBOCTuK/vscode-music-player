name: Deploy release

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Версия для релиза (например, v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-backend:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build backend
        run: cargo build --release --manifest-path backend/Cargo.toml

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stage | Out-Null
          Copy-Item backend/target/release/backend.exe stage/
          Copy-Item LICENSE, README.md stage/
          Compress-Archive -Path stage/* -DestinationPath release-backend.zip

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-windows
          path: release-backend.zip

  build-extension:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build extension
        run: pnpm --filter ./extension run compile

      - name: Package vsix
        run: |
          cp LICENSE extension/LICENSE
          mkdir -p release
          pnpm -C extension exec vsce package --out ../release/music-player-extension.vsix

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-vsix
          path: release/*.vsix

  release:
    needs: [build-backend, build-extension]
    runs-on: ubuntu-latest
    steps:
      - name: Generate Token
        id: generate_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.XBOCT_BOT_ID }}
          private-key: ${{ secrets.XBOCT_BOT_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.generate_token.outputs.token }}

      - name: Setup Cocogitto
        uses: ./.github/actions/setup-cocogitto

      - name: Sync and Reset
        run: |
          git fetch origin main --tags --force
          git reset --hard origin/main

      - name: Get Changelog
        id: version_info
        run: |
          VERSION=${{ inputs.version }}
          echo "Get changelog for $VERSION"
          cog changelog $VERSION > GITHUB_CHANGELOG.md
          if [ ! -s GITHUB_CHANGELOG.md ]; then
            echo "Release version $VERSION" > GITHUB_CHANGELOG.md
            echo "::warning title=Changelog::Changelog was empty, used default text."
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Rename and checksum
        run: |
          mv release/backend-windows/release-backend.zip release/music-player-backend-windows-x86_64.zip
          mv release/extension-vsix/music-player-extension.vsix release/
          rm -rf release/backend-windows release/extension-vsix
          cd release && sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: Release ${{ inputs.version }}
          body_path: GITHUB_CHANGELOG.md
          token: ${{ steps.generate_token.outputs.token }}
          files: release/*
