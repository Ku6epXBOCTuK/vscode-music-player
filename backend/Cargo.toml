[package]
name = "backend"
version = "0.1.0"
edition = "2024"
authors = ["Ku6epXBOCTuK"]
license = "MIT"
description = "Local music player backend: playlists and internet radio to a FLAC HTTP stream for OBS"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5", features = ["mp3", "flac", "wav", "aac"] }
rubato = "0.16"
reqwest = { version = "0.12", features = ["stream"] }
futures-util = "0.3"
flacenc = "0.5"
async-stream = "0.3"
bytes = "1"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.21"
windows = { version = "0.61", features = [
    "Win32_System_Console",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Foundation",
] }
